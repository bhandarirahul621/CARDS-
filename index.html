<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blackjack</title>
  <meta name="description" content="A Blackjack game built on the free Deck of Cards API." />
  <link rel="icon" href="https://deckofcardsapi.com/static/img/AS.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Shown for a moment while we check whether you're already logged in -->
  <div class="auth-loading" id="auth-loading">Shuffling up…</div>

  <!-- Login screen: visible when nobody is signed in -->
  <section class="login-screen" id="login-screen" hidden>
    <div class="login-card">
      <img class="login-cards" src="https://deckofcardsapi.com/static/img/AS.png" alt="" />
      <h1>Blackjack</h1>
      <p>Sign in to take a seat at the table.</p>
      <button class="google-btn" id="google-login">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        Sign in with Google
      </button>
      <p class="login-error" id="login-error" role="alert" hidden></p>
    </div>
  </section>

  <main class="table" id="game" hidden>
    <div class="userbar">
      <div class="user">
        <img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer" hidden />
        <span class="avatar avatar-initial" id="avatar-initial" aria-hidden="true"></span>
        <div>
          <div class="greeting" id="greeting"></div>
          <div class="user-email" id="user-email"></div>
        </div>
      </div>
      <button class="btn ghost small" id="sign-out">Sign out</button>
    </div>

    <header class="topbar">
      <h1>Blackjack</h1>
      <div class="stats">
        <span>Bank: <strong id="bank">$1000</strong></span>
        <span>Bet: <strong id="bet">$0</strong></span>
        <span class="shoe">Shoe: <strong id="remaining">–</strong> cards</span>
      </div>
    </header>

    <section class="hand-area" aria-label="Dealer's hand">
      <h2>Dealer <span class="score" id="dealer-score"></span></h2>
      <div class="cards" id="dealer-cards"></div>
    </section>

    <p class="message" id="message" role="status" aria-live="polite">Place your bet to begin.</p>

    <section class="hand-area" aria-label="Your hand">
      <h2>You <span class="score" id="player-score"></span></h2>
      <div class="cards" id="player-cards"></div>
    </section>

    <section class="controls">
      <div class="chips" id="chips">
        <button class="chip" data-amount="10">$10</button>
        <button class="chip" data-amount="25">$25</button>
        <button class="chip" data-amount="50">$50</button>
        <button class="chip" data-amount="100">$100</button>
        <button class="btn ghost" id="clear-bet">Clear</button>
      </div>
      <div class="actions">
        <button class="btn primary" id="deal">Deal</button>
        <button class="btn" id="hit" disabled>Hit</button>
        <button class="btn" id="stand" disabled>Stand</button>
        <button class="btn" id="double" disabled>Double</button>
      </div>
      <button class="btn ghost small" id="reset-bank">Reset bank</button>
    </section>

    <footer class="footer">
      Cards dealt by the <a href="https://deckofcardsapi.com/" target="_blank" rel="noopener">Deck of Cards API</a>
      · 6-deck shoe · Blackjack pays 3:2 · Dealer stands on 17
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
